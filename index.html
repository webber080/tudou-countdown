<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土豆高考倒计时 · 少年加油</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<style>
  :root {
    --bg-top: #0b1030;
    --bg-bottom: #1b2246;
    --gold: #f5c542;
    --gold-soft: #ffd76e;
    --cyan: #7dd3fc;
    --text: #eef1ff;
    --text-dim: #a8b0d8;
    --card: rgba(255,255,255,.06);
    --card-border: rgba(255,255,255,.12);
    --done: rgba(125,211,252,.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1.2px 1.2px at 28% 62%, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(2px 2px at 41% 18%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.2px 1.2px at 55% 78%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.8px 1.8px at 68% 35%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(1.2px 1.2px at 80% 15%, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(1.6px 1.6px at 90% 55%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(1.2px 1.2px at 8% 85%, rgba(255,255,255,.6), transparent 60%),
      linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }

  .hero { text-align: center; }
  .hero h1 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 500;
    letter-spacing: 6px;
    color: var(--text-dim);
    margin-bottom: 36px;
  }
  .count {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .cell {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 10px 12px;
    min-width: 92px;
    backdrop-filter: blur(6px);
  }
  .cell .num {
    font-size: clamp(36px, 9vw, 56px);
    font-weight: 500;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }
  .cell .unit {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 4px;
    margin-top: 2px;
  }
  .target {
    margin-top: 26px;
    font-size: 15px;
    color: var(--text-dim);
  }
  .target b { color: var(--cyan); font-weight: 500; }
  .total-days {
    margin-top: 10px;
    font-size: 17px;
    color: var(--gold-soft);
  }
  .quote {
    margin-top: 26px;
    font-size: clamp(15px, 4vw, 17px);
    color: var(--cyan);
    letter-spacing: 2px;
    min-height: 26px;
  }
  .midterm {
    margin-top: 40px;
    padding-top: 36px;
    border-top: 1px solid rgba(255,255,255,.12);
  }
  .midterm-title {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--cyan);
    margin-bottom: 22px;
  }
  .cell-sm { min-width: 78px; padding: 12px 8px 10px; }
  .num-sm { font-size: clamp(26px, 6.5vw, 40px); }

  section { margin-top: 56px; }
  .sec-title {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 3px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sec-title::before {
    content: "";
    width: 22px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
  }

  .journey {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 26px 22px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .track {
    height: 14px;
    background: rgba(255,255,255,.09);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    border-radius: 8px;
    transition: width .8s ease;
  }
  .progress-pct {
    text-align: right;
    margin-top: 10px;
    font-size: 14px;
    color: var(--gold-soft);
  }
  .progress-pct b { font-weight: 500; }

  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 7px; top: 6px; bottom: 6px;
    width: 2px;
    background: rgba(255,255,255,.14);
    border-radius: 2px;
  }
  .tl-item { position: relative; margin-bottom: 18px; }
  .tl-dot {
    position: absolute;
    left: -26px; top: 22px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--bg-bottom);
    border: 3px solid var(--text-dim);
  }
  .tl-item.future .tl-dot { border-color: var(--gold); }
  .tl-item.next .tl-dot {
    border-color: var(--gold);
    box-shadow: 0 0 0 5px rgba(245,197,66,.18);
  }
  .tl-item.done .tl-dot { border-color: var(--done); background: var(--done); }
  .tl-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 18px;
  }
  .tl-item.next .tl-card {
    border-color: var(--gold);
    background: rgba(245,197,66,.08);
  }
  .tl-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tl-date { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tl-label { font-size: 17px; font-weight: 500; color: var(--text); }
  .tl-item.next .tl-label { color: var(--gold-soft); }
  .tl-note {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tl-remain { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .tl-item.done .tl-remain { color: var(--done); }
  .tl-item.next .tl-remain { color: var(--gold-soft); }

  footer {
    margin-top: 64px;
    text-align: center;
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  @media (max-width: 480px) {
    .cell { min-width: 70px; padding: 12px 6px 10px; }
    .wrap { padding-top: 36px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>距 离 土 豆 高 考 还 有</h1>
    <div class="count" id="count">
      <div class="cell"><div class="num" id="d">0</div><div class="unit">天</div></div>
      <div class="cell"><div class="num" id="h">0</div><div class="unit">时</div></div>
      <div class="cell"><div class="num" id="m">0</div><div class="unit">分</div></div>
      <div class="cell"><div class="num" id="s">0</div><div class="unit">秒</div></div>
    </div>
    <p class="target">目标：<b>2032 年 6 月 7 日</b> 高考</p>
    <p class="total-days" id="totalDays"></p>

    <div class="midterm">
      <div class="midterm-title">距离土豆中考还有</div>
      <div class="count">
        <div class="cell cell-sm"><div class="num num-sm" id="md">0</div><div class="unit">天</div></div>
        <div class="cell cell-sm"><div class="num num-sm" id="mh">0</div><div class="unit">时</div></div>
        <div class="cell cell-sm"><div class="num num-sm" id="mm">0</div><div class="unit">分</div></div>
        <div class="cell cell-sm"><div class="num num-sm" id="ms">0</div><div class="unit">秒</div></div>
      </div>
      <p class="target">目标：<b>2029 年 6 月 15 日</b> 中考（约）</p>
      <p class="total-days" id="midDays"></p>
    </div>

    <p class="quote" id="quote"></p>
  </header>

  <section>
    <h2 class="sec-title">求学之路 · 总进度</h2>
    <div class="journey">
      <div class="progress-label">
        <span>初一开学</span>
        <span>高考 2032.06.07</span>
      </div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="progress-pct">已走过 <b id="pct">0</b>%</div>
    </div>
  </section>

  <section>
    <h2 class="sec-title">关键节点</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <footer>少年不惧岁月长，彼方尚有荣光在</footer>
</div>

<script>
  const GAOKAO = new Date("2032-06-07T09:00:00+08:00").getTime();
  const MIDTERM = new Date("2029-06-15T09:00:00+08:00").getTime();
  const START = new Date("2025-09-01T00:00:00+08:00").getTime();

  const MILESTONES = [
    { date: "2026-09-01", label: "初二开学", note: "初中第 2 年" },
    { date: "2027-09-01", label: "初三开学", note: "初中第 3 年" },
    { date: "2028-09-01", label: "初四开学", note: "初中最后一年" },
    { date: "2029-06-15", label: "中考", note: "人生第一场大考（约）" },
    { date: "2029-09-01", label: "高一开学", note: "高中第 1 年" },
    { date: "2030-09-01", label: "高二开学", note: "高中第 2 年" },
    { date: "2031-09-01", label: "高三开学", note: "高考冲刺年" },
    { date: "2032-06-07", label: "高考", note: "全力以赴，金榜题名" },
  ];

  const QUOTES = [
    "乾坤未定，你我皆是黑马",
    "今天的努力，是明天的底气",
    "少年不惧岁月长，彼方尚有荣光在",
    "不积跬步，无以至千里",
    "愿你全力以赴，不负韶华",
  ];

  const DAY = 86400000;

  function fmtDate(str) {
    const d = new Date(str + "T00:00:00+08:00");
    return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
  }

  function diffDays(ts) {
    return Math.ceil((ts - Date.now()) / DAY);
  }

  function renderTimeline() {
    const el = document.getElementById("timeline");
    const now = Date.now();
    let nextIdx = MILESTONES.findIndex(m => new Date(m.date + "T00:00:00+08:00").getTime() > now);
    if (nextIdx === -1) nextIdx = MILESTONES.length - 1;

    el.innerHTML = MILESTONES.map((m, i) => {
      const ts = new Date(m.date + "T00:00:00+08:00").getTime();
      const cls = i === nextIdx ? "next" : (ts <= now ? "done" : "future");
      const remain = diffDays(ts);
      const remainText = ts <= now
        ? (i === nextIdx ? "就是现在" : "已通过")
        : "还有 " + remain + " 天";
      return (
        '<div class="tl-item ' + cls + '">' +
          '<div class="tl-dot"></div>' +
          '<div class="tl-card">' +
            '<div class="tl-top"><span class="tl-label">' + m.label + '</span><span class="tl-date">' + fmtDate(m.date) + '</span></div>' +
            '<div class="tl-note"><span>' + m.note + '</span><span class="tl-remain">' + remainText + '</span></div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function tick() {
    const diff = Math.max(0, GAOKAO - Date.now());
    document.getElementById("d").textContent = Math.floor(diff / DAY);
    document.getElementById("h").textContent = String(Math.floor(diff % DAY / 3600000)).padStart(2, "0");
    document.getElementById("m").textContent = String(Math.floor(diff % 3600000 / 60000)).padStart(2, "0");
    document.getElementById("s").textContent = String(Math.floor(diff % 60000 / 1000)).padStart(2, "0");

    const days = Math.ceil(diff / DAY);
    const years = Math.floor(days / 365);
    const months = Math.floor((days % 365) / 30);
    const remDays = days - years * 365 - months * 30;
    document.getElementById("totalDays").textContent =
      "还剩约 " + days + " 天 · 约 " + years + " 年 " + months + " 个月 " + remDays + " 天";

    const pct = Math.min(100, Math.max(0, (Date.now() - START) / (GAOKAO - START) * 100));
    document.getElementById("bar").style.width = pct.toFixed(1) + "%";
    document.getElementById("pct").textContent = pct.toFixed(1);

    const diffM = Math.max(0, MIDTERM - Date.now());
    document.getElementById("md").textContent = Math.floor(diffM / DAY);
    document.getElementById("mh").textContent = String(Math.floor(diffM % DAY / 3600000)).padStart(2, "0");
    document.getElementById("mm").textContent = String(Math.floor(diffM % 3600000 / 60000)).padStart(2, "0");
    document.getElementById("ms").textContent = String(Math.floor(diffM % 60000 / 1000)).padStart(2, "0");

    const daysM = Math.ceil(diffM / DAY);
    const yearsM = Math.floor(daysM / 365);
    const monthsM = Math.floor((daysM % 365) / 30);
    const remDaysM = daysM - yearsM * 365 - monthsM * 30;
    document.getElementById("midDays").textContent =
      "还剩约 " + daysM + " 天 · 约 " + yearsM + " 年 " + monthsM + " 个月 " + remDaysM + " 天";
  }

  let qi = 0;
  function rotateQuote() {
    document.getElementById("quote").textContent = "「" + QUOTES[qi] + "」";
    qi = (qi + 1) % QUOTES.length;
  }

  renderTimeline();
  rotateQuote();
  tick();
  setInterval(tick, 1000);
  setInterval(rotateQuote, 8000);
</script>
</body>
</html>
